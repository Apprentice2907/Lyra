name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # list the files: since Node 21 the arguments of --test are file patterns, not folders
      - run: node --test tests/*.test.js
